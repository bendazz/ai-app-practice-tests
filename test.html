<!doctype html>
<html lang="en">
<head>
  <title>Practice Test · AI App Development</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%230f8a8a%22/%3E%3Ccircle cx=%2210%22 cy=%2211%22 r=%223%22 fill=%22%23ffffff%22/%3E%3Ccircle cx=%2222%22 cy=%2221%22 r=%223%22 fill=%22%23ffffff%22/%3E%3Cpath d=%22M12.6 12.8 19.4 19.2%22 stroke=%22%23ffffff%22 stroke-width=%222.4%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
</head>
<body data-page="test">
  <header class="masthead"><div class="wrap">
    <p class="crumb"><a href="./">← All practice tests</a></p>
    <h1 id="title">Practice Test</h1>
    <p class="dek">Work every question on paper first, then choose your answer.</p>
    <ul class="rules"><li>10 questions</li><li>Pencil &amp; paper</li><li>No devices</li></ul>
  </div></header>

  <main><div class="wrap">
    <div class="score" id="score" hidden aria-live="polite"></div>
    <div id="questions"></div>
  </div></main>

  <div class="bar"><div class="wrap">
    <div class="progress"><span id="progress-text"></span>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div></div>
    <button type="button" class="btn btn-primary" id="submit">Submit</button>
  </div></div>
  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
